<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Pictogramas Dinámicos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        .pictograma {
            transition: transform 0.2s;
        }
        .pictograma:hover {
            transform: translateY(-5px);
        }
        .pictograma.seleccionado .card {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .icono-selector {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            transition: border-color 0.2s;
        }
        .icono-selector:hover {
            border-color: #0d6efd;
        }
        #pictogramas-container.empty {
            align-items: center;
            justify-content: center;
        }
        #pictogramas-container.empty::before {
            content: "Aquí aparecerán tus pictogramas...";
            font-size: 1.2rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <header class="text-center mb-4">
            <h1 class="display-4 text-primary">Generador de Pictogramas</h1>
            <p class="lead">Una herramienta para crear secuencias visuales de forma intuitiva.</p>
        </header>

        <main>
            <div class="row align-items-center mb-3">
                <div class="col-md-9">
                    <textarea id="texto-usuario" class="form-control form-control-lg" placeholder="Escribe una frase para generar pictogramas..."></textarea>
                </div>
                <div class="col-md-3 text-end">
                    <button class="btn btn-success btn-lg w-100" id="exportar-pdf-btn">Exportar a PDF</button>
                </div>
            </div>
            <div class="row" id="pictogramas-container-wrapper">
                 <div id="pictogramas-container" class="col-12 d-flex flex-wrap gap-3 justify-content-center bg-light p-3 rounded shadow-sm min-vh-25">
                    <!-- Los pictogramas generados se mostrarán aquí -->
                </div>
            </div>
             <div class="row mt-4">
                <div class="col-12">
                    <h3 class="text-center text-secondary">Buscador de Iconos</h3>
                    <div class="input-group mb-3">
                        <input type="text" id="buscador-iconos-input" class="form-control" placeholder="Buscar un pictograma en ARASAAC...">
                        <button class="btn btn-primary" type="button" id="buscador-iconos-btn">Buscar</button>
                    </div>
                    <div id="selector-iconos" class="d-flex flex-wrap gap-2 justify-content-center bg-white p-3 rounded shadow-sm">
                        <!-- Los iconos se cargarán aquí -->
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center mt-5">
            <p class="text-muted">Creado con ❤️ y JavaScript puro, estilizado con Bootstrap 5.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textoUsuario = document.getElementById('texto-usuario');
            const pictogramasContainer = document.getElementById('pictogramas-container');
            const selectorIconos = document.getElementById('selector-iconos');

            const defaultPictograma = 'https://api.arasaac.org/api/pictograms/5428?download=false'; // Pictograma para "pregunta"
            let pictogramaSeleccionado = null;
            let openMojiData = [];

            const verbos = {
                'correr': 'corriendo',
                'jugar': 'jugando',
                'comer': 'comiendo',
                'beber': 'bebiendo',
                'dormir': 'durmiendo',
                'nadar': 'nadando',
                'leer': 'leyendo',
                'escribir': 'escribiendo',
                'pintar': 'pintando',
                'cantar': 'cantando',
                'bailar': 'bailando',
                'saltar': 'saltando',
                'volar': 'volando',
                'caminar': 'caminando',
            };

            // Cargar datos externos al iniciar
            cargarDatosExternos();
            textoUsuario.addEventListener('input', generarPictogramas);

            function cargarDatosExternos() {
                fetchOpenMojiData();
                cargarDatosMulberry();
            }

            async function fetchOpenMojiData() {
                try {
                    // Usamos un proxy para evitar problemas de CORS si el servidor no lo permite directamente
                    const response = await fetch('https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/data/openmoji.json');
                    if (!response.ok) throw new Error('No se pudo cargar OpenMoji JSON');
                    openMojiData = await response.json();
                    console.log('Datos de OpenMoji cargados.');
                } catch (error) {
                    console.error('Error al cargar los datos de OpenMoji:', error);
                }
            }

            function searchOpenMoji(word) {
                const term = word.toLowerCase();
                // Buscar coincidencia exacta en anotaciones o tags
                const found = openMojiData.find(emoji =>
                    emoji.annotation.toLowerCase() === term ||
                    (emoji.tags && emoji.tags.toLowerCase().split(', ').includes(term))
                );
                return found;
            }

            let mulberryData = null;

            const pictogramProviders = [
                buscarEnArasaac,
                buscarEnMulberry,
                buscarEnOpenMoji,
            ];

            async function buscarPictograma(palabra) {
                // Primero, intenta la búsqueda combinada (ej. "niño corriendo")
                let combinedSearchTerm = null;
                const palabras = palabra.split(' ');
                if (palabras.length > 1 && verbos[palabras[1]]) {
                    combinedSearchTerm = `${palabras[0]} ${verbos[palabras[1]]}`;
                }

                if (combinedSearchTerm) {
                    for (const provider of pictogramProviders) {
                        const url = await provider(combinedSearchTerm);
                        if (url) return url;
                    }
                }

                // Si la búsqueda combinada falla o no aplica, busca la palabra individual
                for (const provider of pictogramProviders) {
                    const url = await provider(palabra);
                    if (url) return url;
                }

                return defaultPictograma;
            }

            async function buscarEnArasaac(palabra) {
                try {
                    const response = await fetch(`https://api.arasaac.org/api/pictograms/es/search/${palabra}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.length > 0) {
                            return `https://api.arasaac.org/api/pictograms/${data[0]._id}?download=false`;
                        }
                    }
                } catch (error) {
                    // Silencioso para permitir que otros proveedores lo intenten
                }
                return null;
            }

            async function buscarEnMulberry(palabra) {
                if (!mulberryData) {
                    await cargarDatosMulberry();
                }

                const termino = palabra.toLowerCase();
                const simbolo = mulberryData.find(s => s.SymbolName.toLowerCase() === termino || (s.Tags && s.Tags.toLowerCase().split(',').includes(termino)));

                if (simbolo) {
                    // El nombre del archivo en el zip no siempre coincide con SymbolName, pero suele ser cercano.
                    // Esta es una limitación del dataset de Mulberry. Usaremos SymbolName como mejor aproximación.
                    const nombreArchivo = simbolo.SymbolName.replace(/\s/g, '%20');
                    return `https://raw.githubusercontent.com/mulberrysymbols/mulberry-symbols/main/symbols/svg/${nombreArchivo}.svg`;
                }
                return null;
            }

            async function cargarDatosMulberry() {
                if (mulberryData) return;
                try {
                    const response = await fetch('https://raw.githubusercontent.com/mulberrysymbols/mulberry-symbols/main/symbol-info.csv');
                    const csvText = await response.text();
                    // Simple CSV parser
                    const lines = csvText.split('\n');
                    const headers = lines[0].split(',');
                    mulberryData = lines.slice(1).map(line => {
                        const values = line.split(',');
                        return headers.reduce((obj, header, index) => {
                            obj[header.trim()] = values[index] ? values[index].trim() : '';
                            return obj;
                        }, {});
                    });
                    console.log('Datos de Mulberry Symbols cargados.');
                } catch (error) {
                    console.error('Error al cargar los datos de Mulberry Symbols:', error);
                    mulberryData = []; // Evitar reintentos si falla
                }
            }

            function buscarEnOpenMoji(palabra) {
                const openMojiIcon = searchOpenMoji(palabra);
                if (openMojiIcon) {
                    return `https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/color/72x72/${openMojiIcon.hexcode}.png`;
                }
                return null;
            }

            async function actualizarPictograma(palabra, imgElement) {
                imgElement.classList.remove('loaded');
                const url = await buscarPictograma(palabra);
                imgElement.onload = () => imgElement.classList.add('loaded');
                imgElement.src = url;
            }

            function generarPictogramas() {
                const texto = textoUsuario.value.trim().toLowerCase();
                const palabras = texto.split(/\s+/).filter(palabra => palabra.length > 0);
                pictogramasContainer.innerHTML = '';

                if (palabras.length === 0) {
                    pictogramasContainer.classList.add('empty');
                    return;
                }
                pictogramasContainer.classList.remove('empty');

                let i = 0;
                while (i < palabras.length) {
                    let palabraActual = palabras[i];
                    let palabraSiguiente = palabras[i + 1];

                    let busqueda = palabraActual;
                    let textoMostrado = palabraActual;
                    let palabrasConsumidas = 1;

                    if (palabraSiguiente && verbos[palabraSiguiente]) {
                        busqueda = `${palabraActual} ${verbos[palabraSiguiente]}`;
                        textoMostrado = `${palabraActual} ${palabraSiguiente}`;
                        palabrasConsumidas = 2;
                    }

                    crearPictograma(busqueda, textoMostrado, i);
                    i += palabrasConsumidas;
                }
            }

            function crearPictograma(palabraParaBuscar, palabraParaMostrar, index) {
                const pictogramaCol = document.createElement('div');
                pictogramaCol.className = 'col-6 col-sm-4 col-md-3 col-lg-2 pictograma';
                pictogramaCol.dataset.index = index;

                const card = document.createElement('div');
                card.className = 'card h-100 text-center shadow-sm';

                const img = document.createElement('img');
                img.className = 'card-img-top p-2';
                img.alt = palabraParaMostrar;
                img.style.height = '120px';
                img.style.objectFit = 'contain';
                actualizarPictograma(palabraParaBuscar, img);

                const cardBody = document.createElement('div');
                cardBody.className = 'card-body p-2';

                const span = document.createElement('span');
                span.className = 'card-text';
                span.textContent = palabraParaMostrar;
                span.contentEditable = true;
                span.addEventListener('blur', (e) => {
                    const nuevasPalabras = e.target.textContent.split(' ');
                    actualizarPalabra(index, nuevasPalabras[0]);
                });

                cardBody.appendChild(span);
                card.appendChild(img);
                card.appendChild(cardBody);
                pictogramaCol.appendChild(card);

                pictogramaCol.addEventListener('click', () => seleccionarPictograma(pictogramaCol));
                pictogramasContainer.appendChild(pictogramaCol);
            }

            function actualizarPalabra(index, nuevaPalabra) {
                const palabras = textoUsuario.value.trim().toLowerCase().split(/\s+/);
                palabras[index] = nuevaPalabra.toLowerCase();
                textoUsuario.value = palabras.join(' ');

                const pictogramaDiv = document.querySelector(`.pictograma[data-index='${index}']`);
                const img = pictogramaDiv.querySelector('img');
                actualizarPictograma(nuevaPalabra.toLowerCase(), img);
            }

            function seleccionarPictograma(pictogramaCol) {
                if (pictogramaSeleccionado) {
                    pictogramaSeleccionado.classList.remove('seleccionado');
                }
                pictogramaSeleccionado = pictogramaCol;
                pictogramaSeleccionado.classList.add('seleccionado');
            }

            const exportarPdfBtn = document.getElementById('exportar-pdf-btn');
            const buscadorIconosInput = document.getElementById('buscador-iconos-input');
            const buscadorIconosBtn = document.getElementById('buscador-iconos-btn');

            exportarPdfBtn.addEventListener('click', exportarAPDF);
            buscadorIconosBtn.addEventListener('click', buscarYMostrarIconos);
            buscadorIconosInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    buscarYMostrarIconos();
                }
            });

            async function buscarYMostrarIconos() {
                const termino = buscadorIconosInput.value.trim();
                if (termino.length < 2) return; // No buscar si el término es muy corto

                try {
                    const response = await fetch(`https://api.arasaac.org/api/pictograms/es/search/${termino}`);
                    if (!response.ok) throw new Error('Error en la búsqueda de iconos');
                    const data = await response.json();
                    mostrarIconos(data);
                } catch (error) {
                    console.error('Error al buscar iconos:', error);
                    selectorIconos.innerHTML = '<p class="text-danger">No se pudieron cargar los iconos.</p>';
                }
            }

            function mostrarIconos(iconos) {
                selectorIconos.innerHTML = '';
                if (iconos.length === 0) {
                    selectorIconos.innerHTML = '<p>No se encontraron iconos para esta búsqueda.</p>';
                    return;
                }

                iconos.slice(0, 30).forEach(iconoData => { // Limitar a 30 resultados para no sobrecargar
                    const url = `https://api.arasaac.org/api/pictograms/${iconoData._id}?download=false`;
                    const icono = document.createElement('img');
                    icono.src = url;
                    icono.alt = iconoData.keywords.join(', ');
                    icono.className = 'icono-selector img-thumbnail';
                    icono.style.width = '70px';
                    icono.style.height = '70px';
                    icono.addEventListener('click', () => {
                        if (pictogramaSeleccionado) {
                            const img = pictogramaSeleccionado.querySelector('.card-img-top');
                            img.src = url;

                            pictogramaSeleccionado.classList.remove('seleccionado');
                            pictogramaSeleccionado = null;
                        }
                    });
                    selectorIconos.appendChild(icono);
                });
            }

            function exportarAPDF() {
                const { jsPDF } = window.jspdf;
                const pdfContenedor = document.getElementById('pictogramas-container');

                const originalBackgroundColor = pdfContenedor.style.backgroundColor;
                pdfContenedor.style.backgroundColor = 'white'; // Fondo blanco para el PDF

                exportarPdfBtn.disabled = true;
                exportarPdfBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Exportando...';

                html2canvas(pdfContenedor, {
                    scale: 2, // Mejorar la resolución de la imagen
                    useCORS: true, // Permitir cargar imágenes de otros dominios
                    logging: false
                }).then(canvas => {
                    pdfContenedor.style.backgroundColor = originalBackgroundColor; // Restaurar color original
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF({
                        orientation: 'landscape',
                        unit: 'px',
                        format: [canvas.width, canvas.height]
                    });
                    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                    pdf.save('pictogramas.pdf');

                    exportarPdfBtn.disabled = false;
                    exportarPdfBtn.innerHTML = 'Exportar a PDF';
                }).catch(err => {
                    console.error("Error al exportar a PDF:", err);
                    pdfContenedor.style.backgroundColor = originalBackgroundColor;
                     exportarPdfBtn.disabled = false;
                    exportarPdfBtn.innerHTML = 'Exportar a PDF';
                });
            }

            // Poblar selector de iconos
            const iconosFijos = {
                'feliz': 'https://api.arasaac.org/api/pictograms/3001?download=false',
                'triste': 'https://api.arasaac.org/api/pictograms/3002?download=false',
                'comer': 'https://api.arasaac.org/api/pictograms/2533?download=false',
                'beber': 'https://api.arasaac.org/api/pictograms/2534?download=false',
                'pregunta': 'https://api.arasaac.org/api/pictograms/5428?download=false'
            };

            Object.entries(iconosFijos).forEach(([palabra, url]) => {
                const icono = document.createElement('img');
                icono.src = url;
                icono.alt = palabra;
                icono.className = 'icono-selector img-thumbnail';
                icono.style.width = '60px';
                icono.style.height = '60px';
                icono.addEventListener('click', () => {
                    if (pictogramaSeleccionado) {
                        const img = pictogramaSeleccionado.querySelector('.card-img-top');
                        img.src = url;

                        pictogramaSeleccionado.classList.remove('seleccionado');
                        pictogramaSeleccionado = null;
                    }
                });
                selectorIconos.appendChild(icono);
            });
        });
    </script>
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
